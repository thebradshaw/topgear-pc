<svg xmlns="http://www.w3.org/2000/svg" width="400" height="120" viewBox="0 0 400 120">
  <title>Buy me a coffee</title>
  <rect x="2" y="2" width="396" height="116" rx="22" fill="#2a0b12" stroke="#e8562a" stroke-width="3"/>
  <!-- little flames rising like steam -->
  <path d="M46 34c-6-7 2-12 0-20 7 5 9 12 4 20z" fill="#ff9a3c"/>
  <path d="M62 30c-5-6 1-10 0-16 6 4 7 10 3 16z" fill="#ffcf5a"/>
  <path d="M78 34c-6-7 2-12 0-20 7 5 9 12 4 20z" fill="#ff9a3c"/>
  <!-- mug -->
  <path d="M30 42h64v38a18 18 0 0 1-18 18H48a18 18 0 0 1-18-18z" fill="#f4e6d8"/>
  <path d="M94 50h6a12 12 0 0 1 0 24h-6" fill="none" stroke="#f4e6d8" stroke-width="7"/>
  <rect x="30" y="42" width="64" height="9" fill="#6b3a24"/>
  <!-- face -->
  <ellipse cx="50" cy="66" rx="4" ry="5" fill="#2a0b12"/>
  <ellipse cx="74" cy="66" rx="4" ry="5" fill="#2a0b12"/>
  <circle cx="51.5" cy="64" r="1.4" fill="#fff"/>
  <circle cx="75.5" cy="64" r="1.4" fill="#fff"/>
  <path d="M56 76q6 6 12 0" fill="none" stroke="#2a0b12" stroke-width="2.6" stroke-linecap="round"/>
  <ellipse cx="42" cy="76" rx="5" ry="3" fill="#f28b9b" opacity=".8"/>
  <ellipse cx="82" cy="76" rx="5" ry="3" fill="#f28b9b" opacity=".8"/>
  <!-- tiny devil horns, for HellFire -->
  <path d="M36 42l-4-10 10 8z" fill="#e8562a"/>
  <path d="M88 42l4-10-10 8z" fill="#e8562a"/>
  <text x="128" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="bold" fill="#ffcf5a">Buy me a coffee</text>
  <text x="128" y="86" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#f4e6d8">Enjoying the port? Fuel the next one.</text>
</svg>
