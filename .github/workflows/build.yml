name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        shell: bash
        run: |
          # Errors also go out as annotations, which can be read without the full log.
          set -o pipefail
          cmake --build build --config Release 2>&1 | tee build.log || {
            grep -E ' error |: fatal error' build.log | sort -u | head -40 | sed 's/^/::error::/'
            exit 1
          }
      - name: Test (no ROM)
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: topgear-windows-x64
          path: |
            build/Release/topgear.exe
            build/Release/tg_headless.exe
            README.md

  linux-mingw-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake
      - name: Build
        run: cmake --build build
